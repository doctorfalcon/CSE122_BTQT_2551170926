<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 23 - Thư viện ảnh</title>
    <link rel="stylesheet" href="./bai23.css">
</head>
<body>
    <main class="thuVien">
        <header class="tieuDe">
            <h1>Thư viện ảnh — Hiệu ứng Hover</h1>
            <p>Rê chuột lên ảnh để thấy hiệu ứng phóng to và lớp phủ chú thích.</p>
        </header>

        <div class="luoiAnh">
            <figure class="oAnh" tabindex="0">
                <img
                    src="./Anh/Bai23/1-vinh-ha-long.jpg"
                    alt="Phong cảnh Vịnh Hạ Long"
                >
                <figcaption>Vịnh Hạ Long</figcaption>
            </figure>

            <figure class="oAnh" tabindex="0">
                <img
                    src="./Anh/Bai23/2-son-doong.jpg"
                    alt="Hang Sơn Đoòng"
                >
                <figcaption>Hang Sơn Đoòng</figcaption>
            </figure>

            <figure class="oAnh" tabindex="0">
                <img
                    src="./Anh/Bai23/3-thac-ban-gioc.jpg"
                    alt="Thác Bản Giốc"
                >
                <figcaption>Thác Bản Giốc</figcaption>
            </figure>

            <figure class="oAnh" tabindex="0">
                <img
                    src="./Anh/Bai23/4-fansipan.jpg"
                    alt="Núi Fansipan giữa những tầng mây"
                >
                <figcaption>Fansipan</figcaption>
            </figure>

            <figure class="oAnh" tabindex="0">
                <img
                    src="./Anh/Bai23/5-mekong.jpg"
                    alt="Cảnh sông nước đồng bằng sông Cửu Long"
                >
                <figcaption>Đồng bằng sông Cửu Long</figcaption>
            </figure>

            <figure class="oAnh" tabindex="0">
                <img
                    src="./Anh/Bai23/6-phong-nha.jpg"
                    alt="Bên trong động Phong Nha"
                >
                <figcaption>Động Phong Nha</figcaption>
            </figure>
        </div>

</html>
