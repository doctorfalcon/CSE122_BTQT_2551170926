<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 20 - Hiệu ứng ảnh</title>

    <link rel="stylesheet" href="./bai20.css">
    <script src="./bai20.js" defer></script>
</head>
<body>
    <svg
        class="boLocSvg"
        width="0"
        height="0"
        aria-hidden="true"
        focusable="false"
    >
        <defs>
            <filter
                id="hieuUngSong"
                x="-20%"
                y="-20%"
                width="140%"
                height="140%"
            >
                <feTurbulence
                    type="fractalNoise"
                    baseFrequency="0.015 0.06"
                    numOctaves="2"
                    seed="3"
                    result="nhieu"
                />

                <feDisplacementMap
                    in="SourceGraphic"
                    in2="nhieu"
                    scale="14"
                    xChannelSelector="R"
                    yChannelSelector="G"
                />
            </filter>
        </defs>
    </svg>

    <main class="ungDung">
        <div class="khungAnh">
            <img
                id="hoaHong"
                class="hieuUng-gray"
                src="./Anh/Bai20/hoahong.gif"
                alt="Hoa hồng"
            >

            <p class="loiNhan">Special For You</p>
        </div>

        <div class="thanhNut" role="group" aria-label="Chọn hiệu ứng ảnh">
            <button
                type="button"
                class="dangChon"
                data-effect="gray"
                aria-pressed="true"
            >Gray</button>

            <button type="button" data-effect="xray"
                    aria-pressed="false">Xray</button>

            <button type="button" data-effect="invert"
                    aria-pressed="false">Invert</button>

            <button type="button" data-effect="fliph"
                    aria-pressed="false">FlipH</button>

            <button type="button" data-effect="flipv"
                    aria-pressed="false">FlipV</button>

            <button type="button" data-effect="glow"
                    aria-pressed="false">Glow</button>

            <button type="button" data-effect="shadow"
                    aria-pressed="false">Shadow</button>

            <button type="button" data-effect="bold-shadow"
                    aria-pressed="false">Bold Shadow</button>

            <button type="button" data-effect="drop-shadow"
                    aria-pressed="false">DropShadow</button>

            <button type="button" data-effect="blur"
                    aria-pressed="false">Blur</button>

            <button type="button" data-effect="wave"
                    aria-pressed="false">Wave</button>

            <button type="button" data-effect="mask"
                    aria-pressed="false">Mask</button>

            <button type="button" data-effect="alpha"
                    aria-pressed="false">Alpha</button>
        </div>
    </main>
</body>
</html>
