<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - In lịch</title>
    <link rel="stylesheet" href="bai12.css">
    <script src="bai12.js" defer></script>
</head>
<body>
    <main class="khung">
        <section class="lich" aria-live="polite">
            <div id="nam"></div>
            <div id="thang"></div>
            <div id="ngay"></div>
            <div id="thu"></div>
        </section>

        <p id="loiChao"></p>

        <form id="formLich">
            <div class="oNhap">
                <label for="nhapNgay">Ngày</label>
                <input type="number" id="nhapNgay"
                       min="1" max="31" required>
            </div>

            <div class="oNhap">
                <label for="nhapThang">Tháng</label>
                <input type="number" id="nhapThang"
                       min="1" max="12" required>
            </div>

            <div class="oNhap">
                <label for="nhapNam">Năm</label>
                <input type="number" id="nhapNam"
                       min="1" max="9999" required>
            </div>

            <button type="submit">In lịch</button>
        </form>

        <p id="thongBao" role="alert"></p>
    </main>
</body>
</html>
