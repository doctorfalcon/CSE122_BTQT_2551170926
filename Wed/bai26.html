<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký CLB Lập trình Web</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="./bai26.css">
    <script src="./bai26.js" defer></script>
</head>
<body>
    <main class="container py-5">
        <div class="card shadow-sm mx-auto">
            <header class="card-header bg-success text-white text-center py-3">
                <h1 class="h4 mb-0">Đăng ký tham gia CLB Lập trình Web</h1>
            </header>

            <div class="card-body p-4">
                <form id="formDangKy">
                    <div class="row g-3">
                        <div class="col-12 col-md-6">
                            <label for="hoTen" class="form-label">
                                Họ và tên
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="hoTen"
                                name="hoTen"
                                placeholder="Nguyễn Văn A"
                                autocomplete="name"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="maSinhVien" class="form-label">
                                Mã sinh viên
                            </label>
                            <input
                                type="text"
                                class="form-control"
                                id="maSinhVien"
                                name="maSinhVien"
                                placeholder="22xxxxxx"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="email" class="form-label">
                                Email
                            </label>
                            <input
                                type="email"
                                class="form-control"
                                id="email"
                                name="email"
                                placeholder="sv@tlu.edu.vn"
                                autocomplete="email"
                                required
                            >
                        </div>

                        <div class="col-12 col-md-6">
                            <label for="soDienThoai" class="form-label">
                                Số điện thoại
                            </label>
                            <input
                                type="tel"
                                class="form-control"
                                id="soDienThoai"
                                name="soDienThoai"
                                placeholder="09xxxxxxxx"
                                autocomplete="tel"
                                inputmode="tel"
                                pattern="0[0-9]{9}"
                                title="Nhập 10 chữ số, bắt đầu bằng số 0"
                                required
                            >
                        </div>

                        <div class="col-12">
                            <fieldset>
                                <legend class="fs-6 mb-2">Trình độ</legend>

                                <div class="form-check form-check-inline">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="trinhDo"
                                        id="coBan"
                                        value="Cơ bản"
                                        checked
                                        required
                                    >
                                    <label class="form-check-label" for="coBan">
                                        Cơ bản
                                    </label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="trinhDo"
                                        id="kha"
                                        value="Khá"
                                    >
                                    <label class="form-check-label" for="kha">
                                        Khá
                                    </label>
                                </div>

                                <div class="form-check form-check-inline">
                                    <input
                                        class="form-check-input"
                                        type="radio"
                                        name="trinhDo"
                                        id="tot"
                                        value="Tốt"
                                    >
                                    <label class="form-check-label" for="tot">
                                        Tốt
                                    </label>
                                </div>
                            </fieldset>
                        </div>

                        <div class="col-12">
                            <label for="lop" class="form-label">Chọn lớp</label>
                            <select
                                class="form-select"
                                id="lop"
                                name="lop"
                                required
                            >
                                <option value="67CNTT1">67CNTT1</option>
                                <option value="67CNTT2">67CNTT2</option>
                                <option value="67CNTT3">67CNTT3</option>
                                <option value="67CNTT4">67CNTT4</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <div class="form-check">
                                <input
                                    class="form-check-input"
                                    type="checkbox"
                                    id="camKet"
                                    name="camKet"
                                    required
                                >
                                <label class="form-check-label" for="camKet">
                                    Tôi cam kết tự làm bài và quay video OBS
                                </label>
                            </div>
                        </div>

                        <div class="col-12">
                            <div class="d-grid gap-2 d-sm-flex justify-content-sm-end">
                                <button
                                    type="reset"
                                    class="btn btn-outline-secondary"
                                >
                                    Nhập lại
                                </button>

                                <button
                                    type="submit"
                                    class="btn btn-success px-4"
                                >
                                    Đăng ký
                                </button>
                            </div>
                        </div>

                        <div class="col-12" id="vungKetQua" hidden>
                            <div
                                id="ketQua"
                                class="alert alert-success mb-0"
                                role="status"
                                aria-live="polite"
                            ></div>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
