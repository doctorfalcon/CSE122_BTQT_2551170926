<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 15 - Máy tính</title>

    <link rel="stylesheet" href="bai15.css">
    <script src="bai15.js" defer></script>
</head>
<body>
    <main class="mayTinh" aria-label="Máy tính">
        <div class="manHinh">
            <input
                type="text"
                id="phepTinh"
                placeholder="Nhập phép tính..."
                aria-label="Nhập phép tính"
                autocomplete="off"
                spellcheck="false"
            >

            <div id="ketQua" aria-live="polite">0</div>
        </div>

        <div class="banPhim">
            <button type="button" class="xoa" data-value="C">C</button>
            <button type="button" class="phepToan" data-value="()">()</button>
            <button type="button" class="phepToan" data-value="%">%</button>
            <button type="button" class="phepToan" data-value="÷">÷</button>

            <button type="button" data-value="7">7</button>
            <button type="button" data-value="8">8</button>
            <button type="button" data-value="9">9</button>
            <button type="button" class="phepToan" data-value="×">×</button>

            <button type="button" data-value="4">4</button>
            <button type="button" data-value="5">5</button>
            <button type="button" data-value="6">6</button>
            <button type="button" class="phepToan" data-value="-">−</button>

            <button type="button" data-value="1">1</button>
            <button type="button" data-value="2">2</button>
            <button type="button" data-value="3">3</button>
            <button type="button" class="phepToan" data-value="+">+</button>

            <button type="button" class="soKhong" data-value="0">0</button>
            <button type="button" data-value=".">.</button>
            <button type="button" class="bang" data-value="=">=</button>
        </div>
    </main>
</body>
</html>
