<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 29 - Danh sách sinh viên</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
    <link rel="stylesheet" href="./bai29.css">
    <script src="./bai29.js" defer></script>
</head>
<body>
    <main class="container py-5">
        <div class="khungBang">
            <header class="d-flex align-items-center justify-content-between gap-3 mb-3">
                <h1 class="h4 mb-0">Danh sách sinh viên</h1>
                <span id="tongSinhVien" class="badge bg-primary"></span>
            </header>

            <div class="table-responsive rounded border">
                <table class="table table-striped table-hover align-middle mb-0">
                    <caption class="visually-hidden">
                        Danh sách sinh viên và kết quả học tập
                    </caption>

                    <thead class="table-dark">
                        <tr>
                            <th scope="col">#</th>
                            <th scope="col">Mã SV</th>
                            <th scope="col">Họ và tên</th>
                            <th scope="col">Lớp</th>
                            <th scope="col" class="text-center">Điểm</th>
                            <th scope="col" class="text-center">Trạng thái</th>
                        </tr>
                    </thead>

                    <tbody id="duLieuBang"></tbody>
                </table>
            </div>

            <p
                id="thongTinTrang"
                class="text-secondary text-center small mt-3 mb-2"
                role="status"
                aria-live="polite"
            ></p>

            <nav aria-label="Phân trang danh sách sinh viên">
                <ul
                    id="phanTrang"
                    class="pagination justify-content-center mb-0"
                ></ul>
            </nav>
        </div>
    </main>
</body>
</html>
